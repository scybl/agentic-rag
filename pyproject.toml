[project]
name = "agentic-rag"
version = "1.0.0rc1"
description = "Auditable local research CLI: bounded LangGraph workflows, versioned reading memory, resumable execution and evidence-based evaluation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "bizare" }]
keywords = ["rag", "langgraph", "langchain", "agents", "ollama", "ragas"]

dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "langchain-core>=0.3",
    # 限制在 0.4 以下：ragas 会导入已在 0.4 中移除的 langchain_community.chat_models.vertexai
    "langchain-community>=0.3,<0.4",
    "langchain-text-splitters>=0.3",
    "langchain-ollama>=0.2",
    "ollama>=0.6",
    "httpx>=0.27",
    "langchain-huggingface>=0.1",
    "langchain-chroma>=0.1",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.3",
    "ddgs>=9.0",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
eval = ["ragas>=0.4", "datasets>=2.0", "pandas>=2.0"]
retrieval-eval = ["ranx>=0.3.20,<0.4"]
dev = ["pytest>=8.0"]

[project.scripts]
agentic-rag = "agentic_rag.cli:main"
agentic-rag-ingest = "agentic_rag.ingestion:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# 验收归档可能含旧发布包，不能把其中的同名测试当成当前源码测试收集。
testpaths = ["tests"]
